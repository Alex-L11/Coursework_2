[project]
name = "courswork-2"
version = "0.1.0"
description = ""
authors = [
    {name = "Alex",email = "hopiru@mail.ru"}
]
requires-python = ">=3.14"
dependencies = [
    "requests (>=2.34.2,<3.0.0)",
    "tenacity (>=9.2.1,<10.0.0)",
    "pycountry (>=26.2.16,<27.0.0)",
    "pytest (>=9.2.0,<10.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.5.0,<8.0.0)",
    "mypy (>=2.4.1,<3.0.0)",
    "black (>=26.10.1,<27.0.0)",
    "isort (>=9.0.2,<10.0.0)"
]
dev = [
    "pytest-cov (>=7.1.0,<8.0.0)"
]

[tool.black]
line-length = 119
exclude = '''/( \.git, .hg, .tox )/'''
[tool.isort]
profile = "black"

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true